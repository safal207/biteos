name: Check BiteOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy, rustfmt
      - run: pnpm --dir apps/kiosk install --frozen-lockfile
      - run: node scripts/test.mjs
      - run: cargo fmt --manifest-path services/recommender/Cargo.toml -- --check
      - run: go test -race ./...
        working-directory: services/api
