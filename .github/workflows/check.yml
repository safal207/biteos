name: Check BiteOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy, rustfmt
      - run: pnpm --dir apps/kiosk install --frozen-lockfile
      - run: node scripts/dependency-review.mjs
      - run: node scripts/test.mjs
      - run: node --test scripts/robys-counter-report.test.mjs scripts/robys-engagement.test.mjs scripts/robys-event-collector.test.mjs scripts/robys-pilot-handoff.test.mjs
      - run: cargo fmt --manifest-path services/recommender/Cargo.toml -- --check
      - run: go test -race ./...
        working-directory: services/api
      - name: Install open-source SQLite system library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config
      - name: SQLite WAL and transactional outbox
        working-directory: services/api
        env:
          CGO_ENABLED: '1'
        run: |
          pkg-config --modversion sqlite3
          go test -race -count=1 -tags sqlite ./...

  robys-pilot-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/checkout@v4
        with:
          repository: safal207/robys-coffee-house-demo
          ref: ceba0f55fe270429fa3080020834312d30d76967
          path: reviewed-robys
          persist-credentials: false
      - name: Verify pinned producer contract and offline handoff
        env:
          ROBYS_CONTRACT_FILE: reviewed-robys/scripts/biteos-pilot-contract.mjs
        run: node --test scripts/robys-pilot-handoff.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: safal207/robys-coffee-house-demo
          ref: 3d1f251ebf362009273b0c0c437f4076171b48de
          path: reviewed-sounds
          persist-credentials: false
          sparse-checkout: |
            docs/prototypes/coffee-club/sounds-model.mjs
          sparse-checkout-cone-mode: false
      - name: Verify reviewed Sounds mood adapter
        env:
          ROBYS_SOUNDS_MODEL: reviewed-sounds/docs/prototypes/coffee-club/sounds-model.mjs
        run: node --test apps/kiosk/tests/robys-sounds-advice.test.mjs
